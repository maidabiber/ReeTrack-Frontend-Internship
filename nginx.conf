# Serves the ReeTrack SPA. Sits behind Caddy (which terminates TLS and forwards /api + /hubs
# to the backend), so this only ever handles static assets and the SPA fallback.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are safe to cache aggressively/immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry HTML must never be long-cached, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (React Router history mode): every unknown path -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
